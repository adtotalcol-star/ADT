<!--
  ADT - Services Component
  Nuestros servicios profesionales
-->
<section class="section section--dark" id="services" aria-labelledby="services-title">
  <div class="container">
    <div class="text-center" style="margin-bottom: var(--spacing-3xl);">
      <span class="badge" data-animate="fade-in">Soluciones integrales</span>
      <h2 class="text-gradient" id="services-title" style="margin: var(--spacing-lg) 0;" data-animate="fade-in-up">
        Servicios que impulsan tu exito digital
      </h2>
      <p style="max-width: 600px; margin: 0 auto; color: var(--text-muted);" data-animate="fade-in-up" data-delay="1">
        Haz clic en cualquier servicio para ver alcance, beneficios, entregables y solicitar informacion puntual.
      </p>
    </div>

    <div class="services__grid">
      <button class="card service-card scroll-reveal" type="button" data-service="web" data-animate="fade-in-up">
        <span class="service-card__icon" aria-hidden="true">
          <img src="https://img.icons8.com/?size=100&id=y9OsIxmZTFWI&format=png&color=000000" alt="">
        </span>
        <span class="card__title">Diseno Web Profesional</span>
        <span class="card__description">Paginas web rapidas, modernas y responsive que convierten visitantes en clientes.</span>
        <span class="service-card__action">Ver detalles</span>
      </button>

      <button class="card service-card scroll-reveal" type="button" data-service="ecommerce" data-animate="fade-in-up" data-delay="1">
        <span class="service-card__icon" aria-hidden="true">
          <img src="https://img.icons8.com/?size=100&id=8Na1VyvcBemC&format=png&color=000000" alt="">
        </span>
        <span class="card__title">Tiendas Online</span>
        <span class="card__description">E-commerce completos con pagos, catalogo, inventario y experiencia de compra clara.</span>
        <span class="service-card__action">Ver detalles</span>
      </button>

      <button class="card service-card scroll-reveal" type="button" data-service="social" data-animate="fade-in-up" data-delay="2">
        <span class="service-card__icon" aria-hidden="true">
          <img src="https://cdn3d.iconscout.com/3d/premium/thumb/grupo-de-redes-sociales-3d-icon-png-download-8581419.png" alt="">
        </span>
        <span class="card__title">Redes Sociales</span>
        <span class="card__description">Estrategia, contenido y gestion profesional para mejorar visibilidad y confianza.</span>
        <span class="service-card__action">Ver detalles</span>
      </button>

      <button class="card service-card scroll-reveal" type="button" data-service="seo" data-animate="fade-in-up" data-delay="3">
        <span class="service-card__icon" aria-hidden="true">
          <img src="https://img.icons8.com/?size=100&id=12814&format=png&color=000000" alt="">
        </span>
        <span class="card__title">Posicionamiento SEO</span>
        <span class="card__description">Optimizacion tecnica y de contenido para aparecer ante clientes que ya te estan buscando.</span>
        <span class="service-card__action">Ver detalles</span>
      </button>
    </div>
  </div>
</section>
