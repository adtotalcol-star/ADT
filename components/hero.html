<!-- 
  ADT - Hero Component
  Transforma tu negocio para el futuro
-->
<section class="hero" id="hero" aria-labelledby="hero-title">
  
  <!-- Decorative Background Elements -->
  <div class="decoration decoration--circle" style="top: 10%; right: 10%;"></div>
  <div class="decoration decoration--circle" style="bottom: 10%; left: 10%; animation-delay: -3s;"></div>
  
  <div class="container hero__content">
    
    <!-- Badge -->
    <span class="badge" data-animate="fade-in">
      ✨ Transformación Digital
    </span>

    <!-- Main Title -->
    <h1 class="hero__title text-gradient" id="hero-title" data-animate="fade-in-up" data-delay="1">
      Transforma tu negocio para el futuro
    </h1>

    <!-- Subtitle -->
    <p class="hero__subtitle" data-animate="fade-in-up" data-delay="2">
      Impulsamos la digitalización de empresas con soluciones modernas y efectivas.
    </p>

    <!-- Call to Action Buttons -->
    <div class="hero__actions" data-animate="fade-in-up" data-delay="3">
      <a href="#services" class="btn btn--primary btn--large">
        Explorar Servicios
      </a>
      <a href="#contact" class="btn btn--outline btn--large">
        Contáctanos
      </a>
    </div>

    <!-- Trust Indicators -->
    <div class="hero__trust" style="margin-top: 3rem;" data-animate="fade-in" data-delay="4">
      <p style="color: var(--text-muted); font-size: var(--font-size-sm);">
        +150 empresas transformadas • 98% satisfacción • Soporte 24/7
      </p>
    </div>

  </div>
</section>
